<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALT Text Generator | Premium Image Analysis</title>
  <meta name="description" content="Generate high-quality ALT text for your images using advanced AI models like Gemini and Llama.">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <div class="container">
    <h1>ALT Text Generator</h1>
    <p class="subtitle">AI-powered image analysis for accessibility</p>

    <div class="form-group">
      <label for="url-input">Image URL</label>
      <input type="url" id="url-input" placeholder="https://example.com/image.jpg" required />
    </div>

    <div class="form-group">
      <label for="model-select">AI Model</label>
      <select id="model-select">
        <option value="groq">Groq (Llama 4)</option>
        <option value="gemini">Gemini (Google)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="lang-select">Output Language</label>
      <select id="lang-select">
        <option value="English">English</option>
        <option value="German">Deutsch</option>
        <option value="Spanish">Español</option>
        <option value="French">Français</option>
      </select>
    </div>

    <div id="preview">
      <label>Image preview</label>
      <img id="preview-img" src="" alt="" />
    </div>

    <button id="btn">Generate ALT text</button>

    <div id="error"></div>

    <div id="result">
      <label>Generated ALT text</label>
      <div id="alt-text"></div>
      <div id="char-count"></div>
    </div>

    <div id="limits">
      <span>RPM: <b id="rpm-remaining">?</b> / <b id="rpm-limit">?</b></span>
      <span>RPD: <b id="rpd-remaining">?</b> / <b id="rpd-limit">?</b></span>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>

</html>
