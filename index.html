<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALT Text Generator</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    p {
      color: #666;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      margin-top: 12px;
      padding: 10px 24px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 6px;
      display: none;
    }

    #result label {
      font-size: 0.85rem;
      color: #666;
    }

    #alt-text {
      margin-top: 6px;
      font-size: 1rem;
    }

    #error {
      margin-top: 16px;
      color: red;
      display: none;
    }
  </style>
</head>

<body>
  <h1>ALT Text Generator</h1>
  <p>Paste an image URL and get ready-to-use ALT text powered by Gemini AI.</p>

  <input type="url" id="url-input" placeholder="https://example.com/image.jpg" />
  <button id="btn" onclick="analyze()">Generate ALT text</button>
  <div id="error"></div>

  <div id="result">
    <label>ALT text:</label>
    <div id="alt-text"></div>
  </div>

  <script>
    async function analyze() {
      const url = document.getElementById("url-input").value.trim();
      const btn = document.getElementById("btn");
      const result = document.getElementById("result");
      const altText = document.getElementById("alt-text");
      const error = document.getElementById("error");

      if (!url) return;

      btn.disabled = true;
      btn.textContent = "Analyzing...";
      result.style.display = "none";
      error.style.display = "none";

      try {
        const res = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (data.alt_text) {
          altText.textContent = data.alt_text;
          result.style.display = "block";
        } else {
          throw new Error("No result returned");
        }
      } catch (e) {
        error.textContent = "Error: " + (data?.error || e.message || "unknown error");
        error.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate ALT text";
      }
    }
  </script>
</body>

</html>
