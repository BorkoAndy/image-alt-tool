<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALT Text Generator | Premium Image Analysis</title>
  <meta name="description" content="Generate high-quality ALT text for your images using AI.">
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 min-h-screen flex items-center justify-center p-4">
  
  <!-- Login Overlay -->
  <div id="login-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-gray-950/40 backdrop-blur-xl transition-all duration-500 opacity-0 pointer-events-none">
    <div class="w-full max-w-md p-10 bg-white/80 dark:bg-gray-900/80 rounded-[2.5rem] shadow-2xl border border-white/20 dark:border-gray-800/50 transform scale-95 transition-all duration-500">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-3xl bg-indigo-600/10 text-indigo-500 mb-6">
          <img src="https://andy-a11y-analyzer.vercel.app/MyIcon.png" class="w-12 h-12" alt="Icon">
        </div>
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Protected Access</h2>
        <p class="text-gray-500 dark:text-gray-400 mt-2">Enter your password to unlock the ALT Text Generator</p>
      </div>
      
      <form id="login-form" class="space-y-6">
        <div class="space-y-2">
          <label for="login-password" class="block text-xs font-semibold text-gray-400 uppercase tracking-widest pl-1">Password</label>
          <input type="password" id="login-password" 
                 class="w-full p-4 rounded-2xl bg-gray-100 dark:bg-gray-800/50 border border-transparent focus:border-indigo-500/50 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all text-center text-xl tracking-widest"
                 placeholder="••••••••" required />
        </div>
        <button type="submit" class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-xl shadow-indigo-500/20 transform active:scale-[0.98] transition-all">
          Unlock Tool
        </button>
      </form>
    </div>
  </div>

  <!-- Theme Toggle -->
  <div class="fixed top-6 right-6">
    <button id="theme-toggle" class="p-2 rounded-full bg-white dark:bg-gray-800 shadow-md hover:shadow-lg focus:outline-none transition-all">
      <span id="theme-toggle-icon" class="text-xl">🌙</span>
    </button>
  </div>

  <div class="w-full max-width-2xl p-8 bg-white dark:bg-gray-900 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-800 max-w-xl transition-all">
    <header class="mb-8">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent flex items-center gap-3">
        <img src="https://andy-a11y-analyzer.vercel.app/MyIcon.png" class="w-8 h-8" alt="Icon">
        ALT Text Generator
      </h1>
      <p class="text-gray-500 dark:text-gray-400 mt-2">AI-powered image analysis for accessibility</p>
    </header>

    <div class="space-y-6">
      <div class="form-group">
        <label for="url-input" class="block text-sm font-semibold text-gray-400 mb-2 uppercase tracking-wider">Image URL</label>
        <input type="url" id="url-input" 
               class="w-full p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
               placeholder="https://example.com/image.jpg" required />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="form-group">
          <label for="model-select" class="block text-sm font-semibold text-gray-400 mb-2 uppercase tracking-wider">AI Model</label>
          <select id="model-select" 
                  class="w-full p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            <option value="groq">Groq (Llama 4)</option>
            <option value="gemini">Gemini (Google)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="lang-select" class="block text-sm font-semibold text-gray-400 mb-2 uppercase tracking-wider">Language</label>
          <select id="lang-select" 
                  class="w-full p-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            <option value="German" selected>Deutsch</option>
            <option value="English">English</option>
          </select>
        </div>
      </div>

      <!-- Verification Section -->
      <div id="verification-container" class="mt-8 space-y-4">
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest text-center">Verify to analyze</label>
        <div id="slider-track" class="relative w-full h-14 bg-gray-100 dark:bg-gray-800 rounded-full border border-gray-200 dark:border-gray-700 flex items-center px-1 overflow-hidden transition-all duration-300">
            <div id="slider-text" class="absolute inset-0 flex items-center justify-center text-sm font-medium text-gray-400 pointer-events-none select-none">
                Slide to Analyze
            </div>
            <div id="slider-handle" class="relative z-10 w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center shadow-lg transition-transform hover:bg-indigo-700 cursor-grab active:cursor-grabbing group">
                <span class="text-white transform group-hover:translate-x-1 transition-transform">→</span>
            </div>
        </div>
      </div>

      <div id="preview" class="hidden mt-6 overflow-hidden rounded-2xl border border-gray-200 dark:border-gray-700 animate-in zoom-in-95 duration-300">
        <div class="bg-gray-100 dark:bg-gray-800 px-4 py-2 border-b border-gray-200 dark:border-gray-700">
          <span class="text-xs font-semibold text-gray-400 uppercase">Preview</span>
        </div>
        <img id="preview-img" src="" alt="" class="w-full h-auto max-h-64 object-contain" />
      </div>

      <button id="btn" disabled class="hidden w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 dark:disabled:bg-gray-800 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 transform active:scale-[0.98] transition-all">
        Generate ALT text
      </button>

      <div id="error" class="hidden p-4 rounded-xl bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 border border-red-100 dark:border-red-900/50 text-sm"></div>

      <div id="result" class="hidden mt-8 p-6 bg-gray-50 dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 animate-in fade-in slide-in-from-bottom-2 duration-500">
        <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Generated ALT text</label>
        <div id="alt-text" class="text-lg leading-relaxed font-medium"></div>
        <div id="char-count" class="mt-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest"></div>
      </div>

      <div id="limits" class="hidden mt-8 pt-6 border-t border-gray-100 dark:border-gray-800 flex flex-wrap gap-4 justify-between">
        <div class="text-[10px] font-bold text-gray-400 uppercase">
          RPM: <span id="rpm-remaining" class="text-gray-600 dark:text-gray-300">?</span> / <span id="rpm-limit" class="text-gray-400">?</span>
        </div>
        <div class="text-[10px] font-bold text-gray-400 uppercase">
          RPD: <span id="rpd-remaining" class="text-gray-600 dark:text-gray-300">?</span> / <span id="rpd-limit" class="text-gray-400">?</span>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>

</html>
